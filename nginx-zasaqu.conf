server {
    listen 80;
    server_name zasaqu.uk localhost;
    root /media/candra/DATA/zashaGo/frontend/dist;
    index index.html;

    # Charset & gzip
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html — JANGAN di-cache agar update langsung terasa
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # APK — download langsung tanpa cache
    location = /zasaqu.apk {
        include snippets/security-headers.conf;
        add_header Content-Disposition 'attachment; filename="ZasaQu.apk"';
        add_header Cache-Control 'no-cache';
        alias /media/candra/DATA/zashaGo/releases/zasaqu.apk;
    }

    # Static assets (hash di nama file) — cache 1 tahun, immutable
    location /assets/ {
        include snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker & manifest — no cache
    location ~* (sw-(admin|mitra)\.js|firebase-messaging-sw\.js|manifest\.json)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Laravel API — proxy ke artisan serve (port 8000)
    location /api/ {
        include snippets/security-headers.conf;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Laravel storage (foto, upload)
    location /storage/ {
        include snippets/security-headers.conf;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Broadcasting auth — diperlukan Echo.js subscribe private channel
    location /broadcasting/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Sanctum CSRF
    location /sanctum/ {
        include snippets/security-headers.conf;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverb WebSocket
    location /app {
        include snippets/security-headers.conf;
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # n8n webhook — untuk Telegram trigger & automation
    location /n8n/ {
        proxy_pass         http://127.0.0.1:5678/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    # SPA — semua route ke index.html (no-cache agar selalu fresh)
    location / {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
